<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Task Board</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>My Task Board</h1>

    <!-- Task Counter -->
    <span id="task-count">0 Tasks</span>

    <!-- Priority Filter -->
    <select id="priority-filter">
        <option value="all">All</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
    </select>
</header>

<main class="board">

    <section id="todo">
        <h2>To Do</h2>
        <ul class="task-list"></ul>
        <button class="add-btn" data-column="todo">+ Add Task</button>
    </section>

    <section id="inprogress">
        <h2>In Progress</h2>
        <ul class="task-list"></ul>
        <button class="add-btn" data-column="inprogress">+ Add Task</button>
    </section>

    <section id="done">
        <h2>Done</h2>
        <ul class="task-list"></ul>
        <button class="add-btn" data-column="done">+ Add Task</button>

        <!-- Clear Done -->
        <button id="clear-done">Clear All</button>
    </section>

</main>

<div id="task-modal" class="modal hidden">

    <div class="modal-content">
        <h3>Add Task</h3>

        <input type="text" id="task-title" placeholder="Task Title">
        <textarea id="task-desc" placeholder="Description"></textarea>

        <select id="task-priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>

        <input type="date" id="task-date">

        <button id="save-task">Save</button>
        <button id="cancel-task">Cancel</button>
    </div>

</div>

<script src="taskmanager.js"></script>

</body>
</html>
